# Local: pip install pre-commit && make hooks-install
# Manual: make lint  |  CI: .github/workflows/lint.yml

repos:
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.1
    hooks:
      - id: markdownlint-cli2
        name: Lint Markdown files
        args: ["--fix"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax

  - repo: local
    hooks:
      - id: skill-secrets-scan
        name: Scan staged SKILL.md for secrets and PII
        entry: bash scripts/hooks/legacy-pre-commit
        language: system
        files: (^|/)SKILL\.md$
      - id: check-tier-a-version
        name: Check Tier A version frontmatter
        entry: python3 scripts/hooks/check-tier-a-version.py
        language: system
        files: ^(principles/.*\.md|ai/claude/skills/[^/]+/SKILL\.md|ai/cursor/rules/.*\.mdc)$
      - id: reconcile-symlinks
        name: Reconcile ai-skills symlinks after merge/commit
        entry: bash scripts/reconcile-symlinks.sh
        language: system
        stages: [post-commit, post-merge]
        always_run: true
        pass_filenames: false
